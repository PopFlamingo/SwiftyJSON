name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Make sure we're on the Xcode that exists on the runner image
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Build
        run: swift build --build-tests

      # Use SPM's native build system and point dyld at Xcode’s frameworks (XCTest*)
      - name: Run tests
        run: |
          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          export DYLD_FRAMEWORK_PATH="$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/Library/Frameworks:$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/Library/PrivateFrameworks"
          export DYLD_LIBRARY_PATH="$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/usr/lib"
          swift test --build-system native -v